services:
  startup_analyst_agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: startup_analyst_agent
    ports:
      - "3773:3773"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      

    env_file:
      - .env
    volumes:
      - ./startup_analyst_agent:/app/startup_analyst_agent
      - ./agent_config.json:/app/agent_config.json
    restart: unless-stopped
    networks:
      - startup_analyst_agent-network
    

networks:
  startup_analyst_agent-network:
    driver: bridge


