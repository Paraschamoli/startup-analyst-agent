# Startup Analysis and Due Diligence Skill
# AI-powered startup intelligence assistant for comprehensive company analysis

# Basic Metadata
id: startup-analyst-v1
name: startup-analyst
version: 1.0.0
author: paras25619@gmail.com

# Description
description: |
  An AI-powered startup intelligence assistant that provides comprehensive due diligence
  and business analysis for investment decisions. This skill evaluates startups by
  analyzing market potential, business models, competition, traction, and risks.
  It delivers structured insights, SWOT analysis, growth opportunities, and data-driven
  recommendations to help founders, investors, and analysts make informed strategic decisions.

# Tags and Modes
tags:
  - startup-analysis
  - due-diligence
  - venture-capital
  - business-intelligence
  - market-research
  - competitive-analysis
  - financial-assessment
  - risk-evaluation
  - investment-analysis

input_modes:
  - text/plain
  - application/json

output_modes:
  - text/plain
  - application/json
  - text/markdown

# Example Queries
examples:
  - "Perform comprehensive due diligence on Tesla as a startup investment opportunity"
  - "Analyze the business model and market potential of OpenAI"
  - "Evaluate Stripe's competitive positioning and growth trajectory"
  - "Assess the investment risks and opportunities for SpaceX"
  - "Provide a SWOT analysis of Airbnb in the current market"

# Detailed Capabilities
capabilities_detail:
  company_analysis:
    supported: true
    levels:
      - quick_assessment
      - comprehensive_due_diligence
      - deep_technical_analysis
    analysis_areas:
      - business_model_validation
      - market_opportunity_assessment
      - competitive_positioning
      - team_evaluation
      - technology_analysis
    time_frame: "current_and_historical"

  financial_assessment:
    supported: true
    metrics:
      - funding_history_analysis
      - revenue_indicators
      - growth_trajectory
      - burn_rate_estimation
      - valuation_assessment
    data_sources:
      - funding_announcements
      - market_reports
      - competitive_intelligence
      - news_articles

  risk_evaluation:
    supported: true
    risk_types:
      - market_risks
      - competitive_risks
      - technology_risks
      - team_risks
      - financial_risks
      - regulatory_risks
    assessment_methods:
      - qualitative_analysis
      - comparative_assessment
      - scenario_modeling
    confidence_scoring: true

  strategic_recommendations:
    supported: true
    recommendation_types:
      - investment_thesis
      - partnership_opportunities
      - competitive_response
      - growth_strategies
      - risk_mitigation
    formats:
      - executive_summary
      - detailed_report
      - presentation_deck
      - bullet_point_briefing

  report_generation:
    supported: true
    styles:
      - venture_capital_grade
      - executive_summary
      - technical_due_diligence
      - investor_presentation
    sections:
      - executive_summary
      - company_profile
      - financial_metrics
      - risk_assessment
      - strategic_recommendations
      - sources_methodology

# Requirements
requirements:
  packages:
    - agno>=2.2.0
    - bindu>=2026.1.12
    - duckduckgo-search>=7.1.0
    - newspaper4k>=0.1.1
    - openai>=1.60.0
    - python-dotenv>=1.0.1
    - scrapegraph-py>=1.0.0
    - mem0ai>=1.0.1
  system: []
  min_memory_mb: 512
  external_services:
    - DuckDuckGo Search API
    - OpenAI API or OpenRouter API
    - ScrapeGraph API (optional)
    - Mem0 API (optional)

# Performance Metrics
performance:
  avg_processing_time_ms: 5000
  avg_time_per_source_ms: 800
  max_concurrent_requests: 5
  memory_per_request_mb: 512
  timeout_seconds: 180
  max_companies_per_query: 3
  scalability: horizontal

# Tool Restrictions
allowed_tools:
  - DuckDuckGoTools
  - Newspaper4kTools
  - ScrapeGraphTools
  - Mem0Tools
  - Search
  - Analyze
  - Extract
  - Evaluate
  - Generate

# Rich Documentation
documentation:
  overview: |
    This skill specializes in startup analysis and investment due diligence, providing
    comprehensive business intelligence for venture capital decisions. It combines
    market research, financial analysis, competitive intelligence, and risk assessment
    to deliver actionable insights for investors, founders, and analysts.

    The agent excels at breaking down complex business opportunities, providing
    data-driven recommendations, and delivering professional-grade reports suitable
    for investment committee reviews.

  use_cases:
    when_to_use:
      - User requests startup or company analysis for investment decisions
      - User needs due diligence on potential investment opportunities
      - User asks for competitive analysis of companies or industries
      - User requests business model evaluation or market sizing
      - User needs risk assessment for strategic planning
      - User wants executive summaries of company opportunities

    when_not_to_use:
      - Simple company information lookup (use general search)
      - Real-time stock price analysis (use financial data agent)
      - Legal document analysis (use legal review agent)
      - Personal financial advice (use financial planning agent)
      - Code or technical implementation details (use engineering agent)

  input_structure: |
    Accepts startup analysis queries with optional specifications:

    {
      "query": "Company name or analysis request",
      "analysis_depth": "quick|comprehensive|deep",
      "report_style": "vc_grade|executive|technical|presentation",
      "focus_areas": ["business_model", "financials", "competition", "risks"],
      "comparison_companies": ["competitor1", "competitor2"],
      "time_horizon": "immediate|1_year|3_year|5_year"
    }

    Query constraints:
    - Max query length: 500 characters
    - Max companies per analysis: 3
    - Timeout: 180 seconds
    - Language: English primary

  output_format: |
    Standard Startup Analysis Report:
    {
      "success": true,
      "report": {
        "title": "Generated report title",
        "executive_summary": "Brief overview of analysis...",
        "company_profile": {
          "business_model": "Description...",
          "market_opportunity": "Analysis...",
          "team_assessment": "Evaluation...",
          "technology_advantages": "Assessment..."
        },
        "financial_assessment": {
          "funding_history": "Summary...",
          "growth_metrics": "Analysis...",
          "valuation_insights": "Assessment..."
        },
        "risk_evaluation": {
          "market_risks": "Analysis...",
          "competitive_risks": "Assessment...",
          "financial_risks": "Evaluation...",
          "overall_risk_score": 0.75
        },
        "strategic_recommendations": [
          "Recommendation 1 with rationale",
          "Recommendation 2 with rationale"
        ]
      },
      "sources": [
        {
          "url": "source_url",
          "type": "news|funding|report|website",
          "credibility_score": 0.85,
          "relevance_score": 0.90,
          "key_insights": "Extracted insights"
        }
      ],
      "metadata": {
        "query": "original_query",
        "processing_time_ms": 6200,
        "sources_analyzed": 15,
        "confidence_score": 0.87,
        "analysis_depth": "comprehensive"
      }
    }

  error_handling:
    - "No information found: Returns structured explanation of search attempts"
    - "Private company data limited: Flags data limitations and suggests alternatives"
    - "Conflicting financial data: Presents multiple sources with credibility assessment"
    - "Complex analysis timeout: Returns partial results with completion status"
    - "Unclear company reference: Asks for clarification or provides disambiguation"
    - "Sensitive financial projections: Includes appropriate disclaimers"

  examples:
    - title: "Tesla Startup Analysis"
      input:
        query: "Perform comprehensive due diligence on Tesla as a startup investment opportunity"
        analysis_depth: "comprehensive"
        report_style: "vc_grade"
      output:
        success: true
        report:
          title: "Tesla Investment Analysis: Electric Vehicle Market Leadership Assessment"
          executive_summary: "Tesla represents a dominant player in the EV market with..."
          company_profile: {...}
          financial_assessment: {...}
          risk_evaluation: {...}
        sources: [...]
        metadata:
          processing_time_ms: 8500
          sources_analyzed: 18
          confidence_score: 0.89

    - title: "OpenAI Business Model Analysis"
      input:
        query: "Analyze the business model and market potential of OpenAI"
        analysis_depth: "deep"
        report_style: "technical"
      output:
        success: true
        report:
          title: "OpenAI Strategic Analysis: AI Platform Business Model Evaluation"
          executive_summary: "OpenAI has transitioned from research lab to commercial AI platform..."
          company_profile: {...}
          financial_assessment: {...}
          risk_evaluation: {...}
        sources: [...]
        metadata:
          processing_time_ms: 7200
          sources_analyzed: 14

  best_practices:
    for_developers:
      - "Specify analysis_depth to control research intensity"
      - "Use report_style to match output to audience (VC vs executive)"
      - "Include comparison_companies for competitive analysis context"
      - "Handle private company data limitations gracefully"
      - "Cache frequent company analyses to improve performance"
      - "Implement source credibility scoring for confidence assessment"

    for_orchestrators:
      - "Route investment and business analysis queries to this skill"
      - "Chain with summary agents for executive briefings"
      - "Consider query complexity for timeout settings"
      - "Balance depth vs speed based on user urgency"
      - "Use confidence scores for quality assurance"
      - "Implement fallback to basic search for simple company info"
      - "Monitor industry coverage for bias avoidance"

  installation: |
    Required packages:
    pip install agno bindu duckduckgo-search newspaper4k openai python-dotenv scrapegraph-py mem0ai

    Environment variables (at least one required):
    OPENAI_API_KEY=your_openai_api_key
    OPENROUTER_API_KEY=your_openrouter_api_key  # Alternative to OpenAI

    Optional environment variables:
    SGAI_API_KEY=your_scrapegraph_api_key  # For enhanced scraping
    MEM0_API_KEY=your_mem0_api_key  # For memory features

  versioning:
    - version: "1.0.0"
      date: "2026-01-13"
      changes: "Initial release with core startup analysis capabilities"
    - version: "1.1.0"
      status: "planned"
      changes: "Add financial database integration and revenue estimation models"
    - version: "1.2.0"
      status: "planned"
      changes: "Enhanced predictive analytics and market trend forecasting"

