id: startup-analyst-v1
name: startup-analyst
version: 1.0.0
author: paras25619@gmail.com

# Description
description: |
  Analyzes startups and private companies by evaluating business models,
  market opportunity, competitive positioning, financial signals, and risks.
  Provides structured due diligence reports, SWOT insights, and investment-oriented
  assessments with balanced opportunity and risk evaluation.

# Tags and Modes
tags:
  - startup
  - due-diligence
  - venture-capital
  - business-analysis
  - investment
  - competitive-analysis
  - market-research

input_modes:
  - text/plain
  - application/json

output_modes:
  - text/plain
  - application/json

# Example Queries
examples:
  - "Perform comprehensive due diligence on Stripe"
  - "Analyze the business model and risks of OpenAI"
  - "Evaluate Airbnb as a long-term investment opportunity"
  - "Provide a SWOT analysis of SpaceX"
  - "Assess the competitive landscape of Revolut"

# Detailed Capabilities
capabilities_detail:
  primary_capability:
    supported: true
    description: "Performs structured startup and company due diligence analysis"
    features:
      - "Evaluates business model sustainability"
      - "Assesses market opportunity and TAM/SAM potential"
      - "Analyzes competitive positioning and defensibility"
      - "Reviews funding history and financial indicators"
      - "Identifies operational, market, and regulatory risks"
      - "Generates structured executive summaries"
    limitations: "Private company financials may be limited; projections are inferential and not guaranteed"

  secondary_capability:
    supported: true
    description: "Provides scoring, SWOT insights, and strategic recommendations"
    features:
      - "Generates SWOT analysis (Strengths, Weaknesses, Opportunities, Threats)"
      - "Assigns opportunity and risk scores (0–1 scale)"
      - "Provides prioritized strategic recommendations"
      - "Supports competitive comparison (up to 3 companies)"

# Requirements
requirements:
  packages:
    - "agno"
    - "openai or openrouter"
    - "duckduckgo-search"
    - "newspaper4k"
    - "mem0"
  system:
    - "Internet access for market and funding verification"
  min_memory_mb: 512

# Performance Metrics
performance:
  avg_processing_time_ms: 6000
  max_concurrent_requests: 5
  memory_per_request_mb: 512
  scalability: horizontal

# Tool Restrictions
allowed_tools:
  - Read
  - Write
  - Execute
  - Search
  - Analyze
  - Extract
  - Evaluate
  - Generate

# Rich Documentation
documentation:
  overview: |
    This skill provides structured, investment-oriented startup analysis.
    It evaluates business fundamentals, market dynamics, financial signals,
    and competitive risk factors to generate balanced due diligence reports.

    Designed for venture capital research, founder strategy review,
    and investment committee preparation. Outputs include executive summaries,
    structured risk assessments, and actionable strategic recommendations.

  use_cases:
    when_to_use:
      - "Evaluating startups for investment consideration"
      - "Performing structured due diligence"
      - "Assessing business models and scalability"
      - "Analyzing competitive positioning"
      - "Identifying risks before strategic decisions"
      - "Preparing executive or investor-ready summaries"

    when_not_to_use:
      - "Simple company information lookup"
      - "Real-time stock trading decisions"
      - "Legal contract review"
      - "Personal financial advice"
      - "Technical product debugging"

  input_structure: |
    Accepts startup or company analysis requests in plain text or JSON format.

    Example (Plain Text):
    "Analyze Stripe's business model and risks"

    Example (JSON):
    {
      "query": "Analyze OpenAI as an investment opportunity",
      "analysis_depth": "quick|comprehensive|deep",
      "focus_areas": ["business_model", "financials", "competition", "risks"],
      "comparison_companies": ["Anthropic", "Google DeepMind"],
      "report_style": "executive|vc_grade|technical"
    }

    Constraints:
    - Maximum 3 companies per request
    - English language
    - Intended for analytical evaluation, not personal investment advice

  output_format: |
    Returns structured startup analysis with investment-relevant sections.

    Output Structure:
    - EXECUTIVE SUMMARY:
      - Investment positioning
      - Opportunity score (0–1)
      - Risk score (0–1)
      - Overall recommendation
    - COMPANY PROFILE:
      - Business model
      - Market opportunity
      - Competitive positioning
      - Team assessment
      - Technology advantages
    - FINANCIAL ASSESSMENT:
      - Funding history
      - Growth indicators
      - Valuation insights
    - RISK EVALUATION:
      - Identified risks with severity
      - Aggregate risk score
    - STRATEGIC RECOMMENDATIONS:
      - Prioritized recommendations with rationale
    - CONFIDENCE SCORE:
      - 0–1 scale reflecting data reliability

  error_handling:
    - "Ambiguous company reference: Requests clarification"
    - "Insufficient public data: Notes data limitations in report"
    - "Too many companies: Limits to 3 and informs user"
    - "API timeout: Retries up to 3 times before partial return"
    - "Conflicting financial data: Presents multiple interpretations with source commentary"

  examples:
    - title: "Stripe Investment Analysis"
      input:
        query: "Perform comprehensive due diligence on Stripe"
      output:
        executive_summary: "Stripe demonstrates strong SaaS infrastructure positioning..."
        opportunity_score: 0.82
        risk_score: 0.36
        confidence_score: 0.88
        processing_time_ms: 6200

    - title: "OpenAI Competitive Evaluation"
      input:
        query: "Analyze OpenAI's competitive risks and market position"
        analysis_depth: "deep"
      output:
        executive_summary: "OpenAI holds strong AI platform leadership but faces scaling and regulatory risk..."
        opportunity_score: 0.85
        risk_score: 0.48
        confidence_score: 0.83
        processing_time_ms: 7100

  best_practices:
    for_developers:
      - "Specify analysis_depth for resource control"
      - "Use structured JSON input for focused analysis"
      - "Limit comparisons to 3 companies maximum"
      - "Present uncertainty clearly when financial data is limited"

    for_orchestrators:
      - "Route startup, venture, and business model queries here"
      - "Chain with summarization agent for board-ready briefs"
      - "Implement timeout logic at 30 seconds"
      - "Monitor opportunity and risk scoring consistency"

  installation: |
    Required packages:
    pip install agno openai duckduckgo-search newspaper4k mem0

    Environment variables (at least one required):
    - OPENAI_API_KEY
    - OPENROUTER_API_KEY

    Optional:
    - MEM0_API_KEY

  versioning:
    - version: "1.0.0"
      date: "2026-01-13"
      changes: "Initial release with structured startup due diligence and scoring"
    - version: "1.1.0"
      status: "planned"
      changes: "Add financial modeling enhancements and improved risk simulation"

# Assessment fields for skill negotiation
assessment:
  keywords:
    - "startup"
    - "due diligence"
    - "investment"
    - "venture capital"
    - "business model"
    - "market opportunity"
    - "competitive analysis"
    - "risk assessment"
    - "SWOT"
    - "company analysis"

  specializations:
    - domain: "technology startups"
      confidence_boost: 0.4
    - domain: "saas business models"
      confidence_boost: 0.3
    - domain: "fintech analysis"
      confidence_boost: 0.3
    - domain: "venture capital research"
      confidence_boost: 0.4

  anti_patterns:
    - "stock price check"
    - "buy or sell recommendation"
    - "legal contract review"
    - "technical implementation help"
    - "simple company lookup"

  complexity_indicators:
    simple:
      - "company overview"
      - "basic business model"
    medium:
      - "market opportunity analysis"
      - "funding history review"
      - "competitive positioning"
    complex:
      - "comprehensive due diligence"
      - "investment thesis"
      - "SWOT analysis"
      - "risk modeling"
      - "multi-company comparison"
