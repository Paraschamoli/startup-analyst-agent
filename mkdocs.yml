site_name: startup-analyst-agent
repo_url: https://github.com/Paraschamoli/startup-analyst-agent
site_url: https://Paraschamoli.github.io/startup-analyst-agent
site_description: Startup Analyst Agent is an AI-powered business intelligence assistant that evaluates startups by analyzing market potential, business models, competition, traction, and risks. It provides structured insights, SWOT analysis, growth opportunities, and data-driven recommendations—helping founders, investors, and analysts make informed strategic decisions.
site_author: Paras Chamoli
edit_uri: edit/main/docs/
repo_name: Paraschamoli/startup-analyst-agent
copyright: Maintained by <a href="https://Paraschamoli.com">Paraschamoli</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/startup_analyst_agent"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Paraschamoli/startup-analyst-agent
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/startup-analyst-agent

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
